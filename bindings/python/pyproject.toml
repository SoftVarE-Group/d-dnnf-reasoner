[project]
name = "ddnnife"
dynamic = ["version"]
description = "A d-DNNF reasoner."
license = "LGPL-3.0-or-later"
readme = "README.md"

[project.urls]
source = "https://github.com/practical-kc/ddnnife"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
profile = "release"
bindings = "uniffi"
manifest-path = "../../ddnnife_ffi/Cargo.toml"
offline = true
