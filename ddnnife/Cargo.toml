[package]
name = "ddnnife"
description = "d-DNNF toolkit"
version = "0.11.0"
repository = "https://github.com/practical-kc/ddnnife"
edition = "2024"
license = "LGPL-3.0-or-later"
workspace = ".."

[dependencies]
bimap = { workspace = true }
bitvec = { workspace = true }
csv = { workspace = true }
ddnnife_cnf = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
nom = { workspace = true }
num = { workspace = true }
petgraph = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rand_pcg = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
streaming-iterator = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
file_diff = { workspace = true }

[[bench]]
name = "load"
harness = false

[[bench]]
name = "sat"
harness = false

[[bench]]
name = "t_wise"
harness = false
