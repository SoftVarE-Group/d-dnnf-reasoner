[package]
name = "ddnnife_cli"
description = "A d-DNNF reasoner."
version = "0.11.0"
repository = "https://github.com/practical-kc/ddnnife"
edition = "2024"
license = "LGPL-3.0-or-later"
readme = "../README.md"
workspace = ".."

[[bin]]
name = "ddnnife"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
csv = { workspace = true }
ddnnife = { workspace = true }
ddnnife_cnf = { workspace = true }
log = { workspace = true }
mimalloc = { workspace = true }
nom = { workspace = true }
nom_permutation = { workspace = true }
pretty_env_logger = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
num = { workspace = true }
